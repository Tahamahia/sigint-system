version: '3.8'

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    build: ./database
    container_name: sigint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sigint_db}
      POSTGRES_USER: ${DB_USER:-sigint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sigint_secure_2024}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sigint-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigint -d sigint_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================
  # Node.js Backend API
  # ============================================
  backend:
    build: ./backend
    container_name: sigint-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      WS_PORT: 4001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sigint_db}
      DB_USER: ${DB_USER:-sigint}
      DB_PASSWORD: ${DB_PASSWORD:-sigint_secure_2024}
    volumes:
      - ./map_tiles:/app/map_tiles:ro
      - uploads:/app/uploads
    ports:
      - "4000:4000"
      - "4001:4001"
    networks:
      - sigint-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Python Middleware (SDR Interface)
  # ============================================
  middleware:
    build: ./middleware
    container_name: sigint-middleware
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:4000
      BACKEND_WS: ws://backend:4001
      MOCK_MODE: ${MOCK_MODE:-true}
      HEALTH_PORT: 5555
    ports:
      - "5555:5555"
    networks:
      - sigint-net
    # Uncomment below for real SDR hardware passthrough:
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb
    # privileged: true
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5555/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ============================================
  # React Frontend (Nginx)
  # ============================================
  frontend:
    build: ./frontend
    container_name: sigint-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - sigint-net

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local

networks:
  sigint-net:
    driver: bridge
